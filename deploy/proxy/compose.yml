name: shared-edge

services:
  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - shared-edge
    security_opt:
      - no-new-privileges:true
    cap_drop: ['ALL']
    cap_add: ['NET_BIND_SERVICE']
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
          pids: 100

networks:
  shared-edge:
    external: true
    name: shared-edge

volumes:
  caddy-data:
  caddy-config:
