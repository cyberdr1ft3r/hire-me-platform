name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  postgres-health:
    name: PostgreSQL Docker Compose health
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy example environment
        run: cp .env.example .env

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Start PostgreSQL
        run: docker compose up -d postgres

      - name: Wait for PostgreSQL health
        run: |
          timeout 90 bash -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" hire-me-postgres 2>/dev/null)" = "healthy" ]; do docker compose ps postgres; sleep 2; done'
          docker compose ps postgres

      - name: Print Docker Compose diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs postgres

      - name: Stop Docker Compose services
        if: always()
        run: docker compose down -v

  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm prisma:validate

      - name: Check Prisma architecture boundaries
        run: pnpm check:architecture

      - name: Remove generated Prisma client
        run: rm -rf apps/api/prisma/generated/client

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Verify clean Prisma generation boundaries
        run: pnpm check:architecture

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify compiled generation assets
        run: pnpm --filter @hire-me/api verify:generation-assets

  database-lifecycle:
    name: Database migration, seed, and integration tests
    runs-on: ubuntu-latest
    env:
      # Issue #90: every database command refuses unless NODE_ENV is exactly
      # "test" and its target is this run's provisioned, marked database. The
      # compose server below is disposable per job; this maintenance connection
      # uses the public development credentials from .env.example.
      NODE_ENV: test
      TEST_DATABASE_ADMIN_URL: postgresql://hire_me:hire_me_dev_password@127.0.0.1:5432/postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Copy example environment
        run: cp .env.example .env

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Start PostgreSQL
        run: docker compose up -d postgres

      - name: Wait for PostgreSQL health
        run: |
          timeout 90 bash -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" hire-me-postgres 2>/dev/null)" = "healthy" ]; do docker compose ps postgres; sleep 2; done'
          docker compose ps postgres

      - name: Check Prisma architecture boundaries
        run: pnpm check:architecture

      - name: Remove generated Prisma client
        run: rm -rf apps/api/prisma/generated/client

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Verify clean Prisma generation boundaries
        run: pnpm check:architecture

      - name: Build shared contracts
        run: pnpm --filter @hire-me/contracts build

      # Creates a uniquely named, marked database with a local ownership receipt,
      # applies every migration, runs the development seed twice and the admin
      # bootstrap twice, and snapshots the seeded authorization catalog.
      - name: Provision disposable test database
        run: pnpm --filter @hire-me/api test:db:provision --github-env

      - name: Integration suite, pass 1
        run: pnpm --filter @hire-me/api test:db

      - name: Authorization catalog check after pass 1
        run: pnpm --filter @hire-me/api test:db:check-catalog

      # Same database, no reseed, files in the opposite order.
      - name: Integration suite, pass 2 (reverse file order, no reseed)
        run: pnpm --filter @hire-me/api test:db
        env:
          HIREME_TEST_FILE_ORDER: reverse

      - name: Authorization catalog check after pass 2
        run: pnpm --filter @hire-me/api test:db:check-catalog

      - name: Foundational suite alone
        run: pnpm --filter @hire-me/api test:db -- test/database.integration.test.ts

      # An unmarked control database and the compose development database must
      # both be refused, by every command, without any change to either.
      - name: Guard refuses unmarked and development databases
        run: pnpm --filter @hire-me/api test:db:verify-refusal
        env:
          TEST_DATABASE_REFUSAL_EXTRA_URL: postgresql://hire_me:hire_me_dev_password@127.0.0.1:5432/hire_me_dev

      - name: Drop this run's test database
        if: always()
        run: pnpm --filter @hire-me/api test:db:drop --if-present

      - name: Print Docker Compose diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs postgres

      - name: Stop Docker Compose services
        if: always()
        run: docker compose down -v
