name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  postgres-health:
    name: PostgreSQL Docker Compose health
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Copy example environment
        run: cp .env.example .env

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Validate staging deployment definitions
        run: |
          STAGING_ENV_FILE=staging.env.example \
          API_IMAGE=ghcr.io/cyberdr1ft3r/hire-me-platform-api@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
          WEB_IMAGE=ghcr.io/cyberdr1ft3r/hire-me-platform-web@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            docker compose -f deploy/staging/compose.yml config --quiet
          ACME_EMAIL=ops@example.test docker compose -f deploy/proxy/compose.yml config --quiet
          sh -n deploy/staging/bin/hireme-staging-deploy
          node --test scripts/staging-deploy-gate.test.mjs

      - name: Start PostgreSQL
        run: docker compose up -d postgres

      - name: Wait for PostgreSQL health
        run: |
          timeout 90 bash -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" hire-me-postgres 2>/dev/null)" = "healthy" ]; do docker compose ps postgres; sleep 2; done'
          docker compose ps postgres

      - name: Print Docker Compose diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs postgres

      - name: Stop Docker Compose services
        if: always()
        run: docker compose down -v

  quality:
    name: Quality checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm prisma:validate

      - name: Check Prisma architecture boundaries
        run: pnpm check:architecture

      - name: Remove generated Prisma client
        run: rm -rf apps/api/prisma/generated/client

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Verify clean Prisma generation boundaries
        run: pnpm check:architecture

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify compiled generation assets
        run: pnpm --filter @hire-me/api verify:generation-assets

      - name: Build final API runtime image for invoice verification
        run: >-
          docker build
          --file apps/api/Dockerfile
          --build-arg VCS_REF="$GITHUB_SHA"
          --tag hire-me-platform-api:invoice-verification
          .

      - name: Verify French invoice in the actual API runtime container
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:size=16m,mode=1777 \
            hire-me-platform-api:invoice-verification \
            node dist/document-generation/container-french-invoice-verification.js \
            | base64 --decode > "$RUNNER_TEMP/hireme-container-french-invoice.pdf"
          node apps/api/scripts/verify-container-french-invoice.mjs \
            "$RUNNER_TEMP/hireme-container-french-invoice.pdf"

  signing-pkcs11-lab:
    name: PKCS#11 SoftHSM signing lab (Issue #183)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install SoftHSM2
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y softhsm2 libsofthsm2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Run PKCS#11 SoftHSM smoke (required)
        env:
          HIREME_PKCS11_LAB_MODULE_PATH: /usr/lib/softhsm/libsofthsm2.so
        run: pnpm --filter @hire-me/api pkcs11:lab-smoke

      - name: Run PKCS#11 SoftHSM lab tests (required mode, fails closed)
        env:
          HIREME_PKCS11_LAB_MODULE_PATH: /usr/lib/softhsm/libsofthsm2.so
        run: pnpm --filter @hire-me/api test:signing-pkcs11-lab:required

  database-lifecycle:
    name: Database migration, seed, and integration tests
    runs-on: ubuntu-24.04
    env:
      # Issue #90: every database command refuses unless NODE_ENV is exactly
      # "test" and its target is this run's provisioned, marked database. The
      # compose server below is disposable per job; this maintenance connection
      # uses the public development credentials from .env.example.
      NODE_ENV: test
      TEST_DATABASE_ADMIN_URL: postgresql://hire_me:hire_me_dev_password@127.0.0.1:5432/postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Copy example environment
        run: cp .env.example .env

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Start PostgreSQL
        run: docker compose up -d postgres

      - name: Wait for PostgreSQL health
        run: |
          timeout 90 bash -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" hire-me-postgres 2>/dev/null)" = "healthy" ]; do docker compose ps postgres; sleep 2; done'
          docker compose ps postgres

      - name: Check Prisma architecture boundaries
        run: pnpm check:architecture

      - name: Remove generated Prisma client
        run: rm -rf apps/api/prisma/generated/client

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Verify clean Prisma generation boundaries
        run: pnpm check:architecture

      - name: Build shared contracts
        run: pnpm --filter @hire-me/contracts build

      # Creates a uniquely named, marked database with a local ownership receipt,
      # applies every migration, runs the development seed twice and the admin
      # bootstrap twice, and snapshots the seeded authorization catalog.
      - name: Provision disposable test database
        run: pnpm --filter @hire-me/api test:db:provision --github-env

      - name: Integration suite, pass 1
        run: pnpm --filter @hire-me/api test:db

      - name: Authorization catalog check after pass 1
        run: pnpm --filter @hire-me/api test:db:check-catalog

      # Same database, no reseed, files in the opposite order.
      - name: Integration suite, pass 2 (reverse file order, no reseed)
        run: pnpm --filter @hire-me/api test:db
        env:
          HIREME_TEST_FILE_ORDER: reverse

      - name: Authorization catalog check after pass 2
        run: pnpm --filter @hire-me/api test:db:check-catalog

      - name: Foundational suite alone
        run: pnpm --filter @hire-me/api test:db -- test/database.integration.test.ts

      # An unmarked control database and the compose development database must
      # both be refused, by every command, without any change to either.
      - name: Guard refuses unmarked and development databases
        run: pnpm --filter @hire-me/api test:db:verify-refusal
        env:
          TEST_DATABASE_REFUSAL_EXTRA_URL: postgresql://hire_me:hire_me_dev_password@127.0.0.1:5432/hire_me_dev

      - name: Drop this run's test database
        if: always()
        run: pnpm --filter @hire-me/api test:db:drop --if-present

      - name: Print Docker Compose diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs postgres

      - name: Stop Docker Compose services
        if: always()
        run: docker compose down -v

  container-images:
    name: Container image (${{ matrix.component }})
    needs: [postgres-health, quality, signing-pkcs11-lab, database-lifecycle]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            file: apps/api/Dockerfile
            image: hire-me-platform-api
          - component: web
            file: apps/web/Dockerfile
            image: hire-me-platform-web

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether immutable tag already exists
        if: github.event_name == 'push'
        id: existing
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}:${GITHUB_SHA}"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and optionally publish immutable image
        if: github.event_name != 'push' || steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VITE_API_BASE_URL=https://hire-me.dr1ft3r.dev
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: mode=max
          sbom: true

      - name: Confirm published SHA tag
        if: github.event_name == 'push'
        run: docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}:${GITHUB_SHA}"

      - name: Smoke-test web runtime security profile
        if: matrix.component == 'web'
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}:${GITHUB_SHA}"
          if [[ "${GITHUB_EVENT_NAME}" != "push" ]]; then
            image="hireme-web-runtime-smoke:${GITHUB_SHA}"
            docker buildx build \
              --file apps/web/Dockerfile \
              --platform linux/amd64 \
              --load \
              --tag "$image" \
              --build-arg "VCS_REF=${GITHUB_SHA}" \
              --build-arg VITE_API_BASE_URL=https://hire-me.dr1ft3r.dev \
              --cache-from type=gha,scope=web \
              .
          fi
          cid=$(docker run -d \
            --read-only \
            --tmpfs /config:size=16m,uid=10001,gid=10001,mode=0700 \
            --tmpfs /data:size=16m,uid=10001,gid=10001,mode=0700 \
            --tmpfs /tmp:size=16m,uid=10001,gid=10001,mode=1777 \
            --security-opt no-new-privileges \
            --cap-drop ALL \
            "$image")
          trap 'docker logs "$cid"; docker rm -f "$cid" >/dev/null' EXIT
          timeout 30 bash -c \
            'until docker exec "$1" wget -q --spider http://127.0.0.1:8080/__health; do sleep 1; done' \
            _ "$cid"
