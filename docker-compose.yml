services:
  postgres:
    image: postgres:16.4-alpine
    container_name: hire-me-postgres
    restart: unless-stopped
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hire_me_dev}
      POSTGRES_USER: ${POSTGRES_USER:-hire_me}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hire_me_dev_password}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
